[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgba-forecasting"
version = "1.0.0"
description = "Solar Geometry-Biased Attention (SGBA) Transformer for short-term PV power forecasting"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    {name = "Mahmudur Rahman Labib", email = "mahmudur.labib@northsouth.edu"},
    {name = "Abdullah Ibne Abbas Munna", email = "abdulla.ibne@northsouth.edu"},
    {name = "Md Abid Hossain Siam", email = "abid.siam@northsouth.edu"},
    {name = "Rashedur M. Rahman", email = "rashedur.rahman@northsouth.edu"},
]
keywords = [
    "photovoltaic-forecasting",
    "transformer",
    "attention-mechanism",
    "solar-energy",
    "deep-learning",
    "pytorch",
    "time-series",
    "physics-informed",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Energy",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "torch>=2.0",
    "scipy>=1.7",
]

[project.optional-dependencies]
all = [
    "pvlib>=0.9",
    "matplotlib>=3.5",
    "xgboost>=1.6",
    "thop>=0.1",
    "scikit-learn>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/mahmudur10/sgba-forecasting"
Repository = "https://github.com/mahmudur10/sgba-forecasting"
Documentation = "https://github.com/mahmudur10/sgba-forecasting#readme"
"Bug Tracker" = "https://github.com/mahmudur10/sgba-forecasting/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sgba*"]
exclude = ["tests*", "scripts*", "notebooks*", "data*", "figures*", "configs*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
