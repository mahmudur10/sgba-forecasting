# Unified training protocol (paper Section 3.5, Table 1)
# Identical for all models, sites, and seeds.

# Optimization
epochs: 100
optimizer: adam
lr: 1.0e-3
weight_decay: 1.0e-5

# LR schedule
lr_schedule: reduce_on_plateau
lr_factor: 0.5
lr_patience: 5
lr_min: 1.0e-6

# Batching and clipping
batch_size: 128
grad_clip_max_norm: 1.0

# Loss
loss: mse

# Random seeds for reproducibility
seeds: [42, 123, 7]

# Architecture (SGBA defaults)
d_model: 96
n_heads: 4
n_blocks: 2
d_ff: 384
d_geo: 32
alpha: 0.9  # EWMA decay for SGBA-EWMA variant
seq_len: 24
input_channels: 5
horizon: 1
dropout: 0.1

# Data splits (chronological, no overlap)
train_split: 0.70
val_split: 0.15
test_split: 0.15

# Preprocessing
ghi_threshold: 10.0  # W/m^2 — below this is treated as nighttime
interp_max_gap: 12   # 1 hour at 5-min resolution

# Statistical testing
dm_max_lag: 24
bootstrap_n: 1000
bootstrap_block_len: 24
bootstrap_seed: 42

# Device
device: cuda  # or cpu
